<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#56604c">
  <meta name="description" content="玥鳴 2026 年 11 月與 12 月的皮下幫忙月曆">
  <title>蚵仔打針排班月曆</title>
  <style>
    :root {
      --paper: #eee8dc;
      --paper-deep: #ded3c2;
      --ink: #3d382f;
      --muted: #5d574e;
      --line: #b9aa94;
      --olive: #56604c;
      --olive-soft: #cbd0bd;
      --clay: #804c38;
      --white: #fbf8f1;
      --radius: 32px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, rgba(255,255,255,.72), transparent 27rem),
        var(--paper-deep);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      padding-right: env(safe-area-inset-right);
      padding-left: env(safe-area-inset-left);
    }

    button { font: inherit; }

    .shell {
      width: min(1040px, calc(100% - 32px));
      margin: 28px auto;
      padding: clamp(20px, 4vw, 48px);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 20px 60px rgba(67, 55, 39, .12);
    }

    .masthead {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 28px;
    }

    h1 {
      margin: 0;
      font-family: "Noto Serif TC", "PMingLiU", serif;
      font-size: clamp(2rem, 6vw, 4.6rem);
      font-weight: 700;
      letter-spacing: -.04em;
      line-height: .98;
    }

    .legend {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: .9rem;
      white-space: nowrap;
    }

    .legend::before {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--olive);
      content: "";
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 6px;
      margin-bottom: 20px;
      background: rgba(185, 170, 148, .28);
      border-radius: 22px;
    }

    .tab {
      min-height: 52px;
      padding: 10px 20px;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: 17px;
      cursor: pointer;
      font-weight: 800;
    }

    .tab[aria-selected="true"] {
      color: var(--white);
      background: var(--olive);
      box-shadow: 0 7px 18px rgba(86, 96, 76, .24);
    }

    .tab:focus-visible { outline: 3px solid var(--clay); outline-offset: 3px; }

    .month-panel[hidden] { display: none; }

    .month-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin: 4px 4px 18px;
    }

    h2 { margin: 0; font: 700 clamp(1.5rem, 3vw, 2.3rem)/1 "Noto Serif TC", "PMingLiU", serif; }
    .month-note { margin: 0; color: var(--muted); font-size: .9rem; }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 5px;
    }

    .weekday {
      padding: 6px 2px;
      color: var(--muted);
      font-size: .76rem;
      font-weight: 800;
      text-align: center;
    }

    .day {
      position: relative;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 108px;
      padding: 12px;
      overflow: hidden;
      color: var(--ink);
      text-align: left;
      background: rgba(251, 248, 241, .76);
      border: 1px solid rgba(185, 170, 148, .5);
      border-radius: 14px;
    }

    button.day { appearance: none; font: inherit; cursor: pointer; }
    button.day:focus-visible { outline: 3px solid var(--clay); outline-offset: 2px; }
    .day.empty { background: transparent; border-color: transparent; }
    .day.no-help { background: rgba(222, 211, 194, .42); border-color: transparent; }
    .day.no-help .shift { color: var(--muted); }
    .date { font: 700 1rem/1 "Noto Serif TC", "PMingLiU", serif; }
    .mobile-weekday { display: none; }

    .day.work {
      color: #30382c;
      background: #d5dccb;
      border-color: transparent;
    }

    .shift {
      display: block;
      margin-top: 10px;
      font-size: .74rem;
      font-weight: 800;
      line-height: 1.45;
    }

    .day-meta { display: block; }
    .time-short { display: none; }

    .helper-name {
      display: block;
      max-width: 100%;
      margin-top: auto;
      overflow: hidden;
      color: var(--ink);
      font-size: .78rem;
      font-weight: 800;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .helper-name.is-empty { color: #8b8478; font-weight: 600; }

    .helper-input {
      width: 100%;
      min-width: 0;
      margin-top: 8px;
      padding: 7px 8px;
      color: var(--ink);
      background: var(--white);
      border: 0;
      border-radius: 9px;
      font-size: .72rem;
      font-weight: 800;
      outline: none;
    }

    .helper-input::placeholder { color: #8d887e; font-weight: 600; }
    .helper-input:focus { box-shadow: 0 0 0 3px #d9bf91; }

    ::selection { color: var(--white); background: var(--olive); }

    .save-note {
      display: block;
      margin-top: 4px;
      color: var(--olive-soft);
      font-size: .58rem;
    }

    .empty-state {
      margin-top: 18px;
      padding: 18px 22px;
      color: var(--muted);
      background: rgba(251, 248, 241, .55);
      border: 1px dashed var(--line);
      border-radius: 18px;
    }

    .footer {
      margin: 22px 4px 0;
      color: var(--muted);
      font-size: .78rem;
    }

    .assign-editor[hidden] { display: none; }

    .assign-editor {
      position: fixed;
      right: max(12px, env(safe-area-inset-right));
      bottom: max(12px, env(safe-area-inset-bottom));
      left: max(12px, env(safe-area-inset-left));
      z-index: 20;
      width: min(460px, calc(100% - 24px));
      margin: auto;
      padding: 16px;
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 16px 44px rgba(61, 56, 47, .2);
    }

    .editor-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .editor-date { display: block; font: 700 1.1rem/1.2 "Noto Serif TC", "PMingLiU", serif; }
    .editor-time { display: block; margin-top: 3px; color: var(--muted); font-size: .78rem; }
    .editor-close { width: 40px; height: 40px; padding: 0; color: var(--muted); background: transparent; border: 0; border-radius: 50%; cursor: pointer; }
    .editor-close:focus-visible { outline: 3px solid var(--clay); }
    .editor-label { display: block; color: var(--muted); font-size: .76rem; font-weight: 800; }
    .editor-label .helper-input { min-height: 46px; margin-top: 6px; font-size: 16px; }

    @media (max-width: 700px) {
      body { padding-bottom: max(8px, env(safe-area-inset-bottom)); }
      .shell {
        width: calc(100% - 16px);
        margin: 8px auto;
        padding: 18px 32px 20px;
        border-radius: 32px;
        box-shadow: 0 12px 32px rgba(67, 55, 39, .1);
      }
      .masthead {
        display: block;
        padding: 2px 2px 0;
        margin-bottom: 14px;
      }
      h1 { font-size: clamp(1.15rem, 5.6vw, 1.35rem); line-height: 1.08; letter-spacing: -.03em; white-space: nowrap; }
      .legend { margin-top: 5px; gap: 6px; font-size: .7rem; }
      .legend::before { width: 8px; height: 8px; }
      .tabs { gap: 4px; padding: 3px; margin-bottom: 12px; border-radius: 14px; }
      .tab { min-height: 40px; padding: 5px 10px; border-radius: 11px; font-size: .84rem; }
      .month-top { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
      .calendar { grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; }
      .weekday { display: block; padding: 1px 0 5px; color: #746d62; font-size: .7rem; line-height: 1; }
      .day.empty { display: block; min-height: 62px; visibility: hidden; }
      .day {
        min-height: 62px;
        padding: 6px 4px 5px;
        background: rgba(251, 248, 241, .66);
        border-color: transparent;
        border-radius: 10px;
      }
      .day.work { background: #d5dccb; }
      .day.no-help { background: rgba(222, 211, 194, .52); }
      .day[aria-pressed="true"] { outline: 2px solid var(--clay); outline-offset: 0; }
      .date { font-size: .92rem; line-height: 1; font-variant-numeric: tabular-nums; }
      .day-meta { display: block; min-width: 0; }
      .mobile-weekday { display: none; }
      .shift { display: block; margin: 5px 0 0; overflow: hidden; color: #655f55; font-size: .7rem; line-height: 1; letter-spacing: -.02em; white-space: nowrap; }
      .day.work .shift { color: #3f4a39; }
      .time-full { display: none; }
      .time-short { display: inline; }
      .helper-name { margin-top: auto; padding-top: 5px; color: #3f3a33; font-size: .7rem; line-height: 1; text-align: left; }
      .helper-name.is-empty { color: #9a9388; }
      .day.no-help .shift { margin-top: auto; color: #716a60; font-size: .7rem; line-height: 1.15; white-space: normal; }
      .footer { margin: 14px 2px 0; font-size: .7rem; line-height: 1.4; }
      .assign-editor { padding: 14px; border-radius: 16px; }
    }

    @media (max-width: 359px) {
      .shell { padding-right: 20px; padding-left: 20px; }
      .masthead { gap: 6px; }
      h1 { font-size: 1.12rem; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div>
        <h1>蚵仔打針排班月曆</h1>
      </div>
      <div class="legend">綠色是上班日</div>
    </header>

    <nav class="tabs" role="tablist" aria-label="選擇月份">
      <button class="tab" id="tab-nov" role="tab" aria-selected="true" aria-controls="panel-nov" data-month="nov">11 月</button>
      <button class="tab" id="tab-dec" role="tab" aria-selected="false" aria-controls="panel-dec" data-month="dec" tabindex="-1">12 月</button>
    </nav>

    <section class="month-panel" id="panel-nov" role="tabpanel" aria-labelledby="tab-nov">
      <div class="month-top"><h2>十一月</h2></div>
      <div class="calendar" id="calendar-nov" aria-label="2026 年 11 月月曆"></div>
    </section>

    <section class="month-panel" id="panel-dec" role="tabpanel" aria-labelledby="tab-dec" hidden>
      <div class="month-top"><h2>十二月</h2></div>
      <div class="calendar" id="calendar-dec" aria-label="2026 年 12 月月曆"></div>
    </section>

    <p class="footer">點日期填寫姓名，會自動儲存在這台裝置。</p>
  </main>

  <section class="assign-editor" id="assign-editor" aria-label="填寫幫忙的人" hidden>
    <div class="editor-head">
      <div>
        <strong class="editor-date" id="editor-date"></strong>
        <span class="editor-time" id="editor-time"></span>
      </div>
      <button class="editor-close" id="editor-close" type="button" aria-label="關閉填寫欄">關閉</button>
    </div>
    <label class="editor-label" for="editor-input">幫忙的人
      <input class="helper-input" id="editor-input" type="text" inputmode="text" autocomplete="off" placeholder="輸入姓名">
    </label>
  </section>

  <script>
    const weekdays = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
    const shifts = {
      11: {
        2: { time: '11:00–20:30' },
        6: { time: '11:00–20:30' },
        9: { time: '11:00–20:30' },
        11: { time: '11:00–20:30' },
        16: { time: '11:00–20:30' },
        20: { time: '11:00–20:30' },
        25: { time: '11:00–20:30' },
        27: { time: '11:00–20:30' }
      },
      12: {}
    };
    const noHelpDates = {
      11: new Set([17, 23, 24, 26]),
      12: new Set()
    };

    const editor = document.getElementById('assign-editor');
    const editorDate = document.getElementById('editor-date');
    const editorTime = document.getElementById('editor-time');
    const editorInput = document.getElementById('editor-input');
    const editorClose = document.getElementById('editor-close');
    let activeAssignment = null;

    function closeEditor() {
      if (activeAssignment) activeAssignment.cell.setAttribute('aria-pressed', 'false');
      activeAssignment = null;
      editor.hidden = true;
    }

    function openEditor(details) {
      if (activeAssignment) activeAssignment.cell.setAttribute('aria-pressed', 'false');
      activeAssignment = details;
      details.cell.setAttribute('aria-pressed', 'true');
      editorDate.textContent = `${details.month} 月 ${details.date} 日`;
      editorTime.textContent = details.helpTime;
      editorInput.value = details.savedName;
      editor.hidden = false;
      editorInput.focus();
      editorInput.select();
    }

    editorInput.addEventListener('input', () => {
      if (!activeAssignment) return;
      const name = editorInput.value.trim();
      localStorage.setItem(activeAssignment.storageKey, name);
      activeAssignment.savedName = name;
      activeAssignment.nameLabel.textContent = name || '—';
      activeAssignment.nameLabel.classList.toggle('is-empty', !name);
      activeAssignment.cell.setAttribute('aria-label', `${activeAssignment.month} 月 ${activeAssignment.date} 日，${activeAssignment.helpTime}，${name ? `幫忙的人是${name}` : '尚未填寫幫忙的人'}`);
    });

    editorClose.addEventListener('click', closeEditor);

    function drawCalendar(targetId, year, month) {
      const root = document.getElementById(targetId);
      weekdays.forEach(label => {
        const item = document.createElement('div');
        item.className = 'weekday';
        item.textContent = label;
        root.append(item);
      });

      const firstDay = new Date(year, month - 1, 1).getDay();
      const totalDays = new Date(year, month, 0).getDate();
      for (let i = 0; i < firstDay; i++) {
        const blank = document.createElement('div');
        blank.className = 'day empty';
        blank.setAttribute('aria-hidden', 'true');
        root.append(blank);
      }

      for (let date = 1; date <= totalDays; date++) {
        const shift = shifts[month][date];
        const noHelp = noHelpDates[month].has(date);
        const helpTime = shift ? '上午 9:00' : '晚上 9:30';
        const shortTime = shift ? '09:00' : '21:30';
        const cell = document.createElement(noHelp ? 'div' : 'button');
        if (!noHelp) cell.type = 'button';
        cell.className = `day${shift ? ' work' : ''}${noHelp ? ' no-help' : ''}`;
        const weekday = weekdays[new Date(year, month - 1, date).getDay()];
        cell.innerHTML = `<span class="date">${date}</span>`;
        if (noHelp) {
          cell.innerHTML += `<div class="day-meta"><span class="mobile-weekday">${weekday}</span><span class="shift">不用排</span></div>`;
          cell.setAttribute('aria-label', `${month} 月 ${date} 日，不用安排`);
          root.append(cell);
          continue;
        }
        const storageKey = `helper-2026-${month}-${date}`;
        const savedName = localStorage.getItem(storageKey) || '';
        cell.innerHTML += `<div class="day-meta"><span class="mobile-weekday">${weekday}</span><span class="shift"><span class="time-full">${helpTime}</span><span class="time-short">${shortTime}</span></span></div><span class="helper-name${savedName ? '' : ' is-empty'}">${savedName || '—'}</span>`;
        const nameLabel = cell.querySelector('.helper-name');
        const details = { cell, month, date, helpTime, storageKey, savedName, nameLabel };
        cell.setAttribute('aria-pressed', 'false');
        cell.addEventListener('click', () => openEditor(details));
        cell.setAttribute('aria-label', `${month} 月 ${date} 日，${helpTime}，${savedName ? `幫忙的人是${savedName}` : '尚未填寫幫忙的人'}`);
        root.append(cell);
      }
    }

    drawCalendar('calendar-nov', 2026, 11);
    drawCalendar('calendar-dec', 2026, 12);

    const tabs = [...document.querySelectorAll('[role="tab"]')];
    function activateTab(tab, updateHash = true) {
      closeEditor();
      tabs.forEach(item => {
        const active = item === tab;
        item.setAttribute('aria-selected', String(active));
        item.tabIndex = active ? 0 : -1;
        document.getElementById(item.getAttribute('aria-controls')).hidden = !active;
      });
      if (updateHash) history.replaceState(null, '', `#${tab.dataset.month}`);
    }

    tabs.forEach((tab, index) => {
      tab.addEventListener('click', () => activateTab(tab));
      tab.addEventListener('keydown', event => {
        if (!['ArrowLeft', 'ArrowRight'].includes(event.key)) return;
        event.preventDefault();
        const step = event.key === 'ArrowRight' ? 1 : -1;
        const next = tabs[(index + step + tabs.length) % tabs.length];
        activateTab(next);
        next.focus();
      });
    });

    const initial = tabs.find(tab => `#${tab.dataset.month}` === location.hash);
    if (initial) activateTab(initial, false);
  </script>
</body>
</html>
